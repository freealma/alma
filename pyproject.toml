[project]
name = "alma"
version = "0.1.0"
description = "Alma - AI Assistant CLI with Memory"
authors = [{name = "Alma Team"}]
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "langchain>=0.1.0",
    "langchain-deepseek>=0.0.2",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
alma = "alma.__main__:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]